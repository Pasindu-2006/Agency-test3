name: CI/CD Pipeline for React App

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHub එකෙන් කෝඩ් එක ඇදගැනීම
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. ඩොකර් බිල්ඩ් කරන්න ප්‍රිපෙයාර් වීම
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. ඩොකර් හබ් එකට ලොග් වීම (අපි හදාගත්ත secrets පාවිච්චි කරලා)
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    # 4. React ඇප් එක ඩොකර් ඉමේජ් එකක් විදිහට බිල්ඩ් කරලා ඩොකර් හබ් එකට පුෂ් කිරීම
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/react-app:latest

    # 5. AWS EC2 සර්වර් එකට SSH හරහා ගිහින් ඩිප්ලෝයි කිරීම
    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
        script: |
          sudo docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/react-app:latest
          sudo docker stop react-container || true
          sudo docker rm react-container || true
          sudo docker run -d --name react-container -p 80:80 ${{ secrets.DOCKER_HUB_USERNAME }}/react-app:latest